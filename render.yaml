services:
  - type: web
    name: kitchensync-beta-10
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build:deploy && npm run db:deploy && npm run db:seed:prod
    startCommand: npm start
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kitchensync-beta-10-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: SERVE_CLIENT
        value: "true"
      - key: CLIENT_ORIGIN
        value: https://kitchensync-beta-10.onrender.com
      - key: GOOGLE_CLIENT_ID
        value: 1070549791591-q7m3po6rhvhu4n3r3vvpee1drd4lpci6.apps.googleusercontent.com
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: AI_FALLBACK_MODEL
        value: gemini-flash-lite-latest

databases:
  - name: kitchensync-beta-10-db
    plan: free
    databaseName: kitchensync
    user: kitchensync
